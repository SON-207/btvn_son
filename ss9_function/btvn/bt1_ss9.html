<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    // Hàm kiểm tra số nguyên tố
    function isPrime(number) {
        // Số nguyên tố phải là số nguyên >= 2
        if (number < 2) return false;
        if (number === 2) return true;
        if (number % 2 === 0) return false;

        // Chỉ cần kiểm tra đến căn bậc hai của number
        const limit = Math.sqrt(number);
        for (let i = 3; i <= limit; i += 2) {
            if (number % i === 0) return false;
        }
        return true;
    }

    // Tìm tất cả số nguyên tố nhỏ hơn 10000
    let primes = [];
    for (let i = 0; i < 10000; i++) {
        if (isPrime(i)) {
            primes.push(i);
        }
    }

    console.log("Các số nguyên tố nhỏ hơn 10000:");
    console.log(primes);
    console.log("Tổng số lượng:", primes.length);
</script>

</body>
</html>

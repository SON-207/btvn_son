<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bai 1</title>
</head>
<body>
<script>
    //nhập mảng
    let N = +prompt("nhap do dai N = ");
    let M = [];
    let chan = 0;
    let le = 0;
    for(let i = 0; i < N ; i++){
        let value = parseInt(prompt("nhap gia tri tai vi tri thu i " +i + " = " ));
        M.push(value);
    }
    console.log(M);
    //kiểm tra mảng chẵn lẻ
    for(let i = 0; i < M.length; i++){
        if(M[i] % 2 === 0){
            chan++;
        }else{
            le++;
        }
    }
    if(chan === le){
        console.log("OKE");
    }else{
        console.log("NO");
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chuyen doi tien te</title>
</head>
<body>
<input id="amount">
<select id = "from">
    <option value = "USD">USD</option>
    <option value = "VND">VND</option>
</select>
<select id ="to">
    <option value = "USD">USD</option>
    <option value ="VND">VND</option>
</select>
<button onclick="convert()">Chuyen doi tien te</button>
<p id="result"></p>
<script>
    function convert() {
        let amount = document.getElementById("amount").value;
        let from = document.getElementById("from").value;
        let to = document.getElementById("to").value;
        let result = 0;
    if (from=="USD" && to=="VND"){
        result = 26000*amount;
        alert(result);
    }else if (from=="VND" && to=="USD"){
        result = amount/26000;
        alert(result);
    }else {
        result = amount;
        alert(result);
    }
    document.getElementById("to").value = result;
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dem 1 toi 99</title>
</head>
bài 1: Sử dụng vòng lặp để đếm từ 1 đến 100. Khi số là 99, hiển thị hộp thoại thông báo là đã hoàn thành.
<body>
<script>
    let n = 100;
    for( let i = 1; i <= n ; i++){
        if(i == 99){
            alert("da hoan thanh");
        }
        console.log(i);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<script>
    let n = 100;
    for(let i = 1 ; i <= n ; i++){
        console.log(i);
        if(i % 3 == 0 && i % 5 == 0){
            console.log("FizzBuzz");
        }else if( i % 3 == 0){
            console.log("Fizz");
        }else if( i % 5 == 0){
            console.log("Buzz");
        }else{
            console.log(" ");
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>

<head>

    <title>gia tri lon nhat</title>
</head>
<body>
<script>
    let a =+prompt("nhap a");
    let b =+prompt("nhap b");
    let c =+prompt("nhap c");
    let max = 0;
    if (a>b && a>c){
        max = a;
    }else if(b>c){
        max = b;
    }else {
        max = c;
    }
    document.write("gia tri lon nhat "+max);
</script>

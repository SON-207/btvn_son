<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nhap 2 so ab</title>
</head>
<body>
<script>
    let a = +prompt("nhap a");
    a = Number(a);
    let b = +prompt("nhap b");
    b = Number(b);
    if(a % b ==0){
        document.write("a chia het cho b");
    }else{
        document.write("a khong chia het cho b");
    }
</script>
</body>

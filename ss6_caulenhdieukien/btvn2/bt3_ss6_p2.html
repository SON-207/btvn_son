<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dientichhinhvuong</title>
</head>
<body>
<h1>Tính diện tích hình vuông</h1>
<script>
    let a = +prompt("nhap cạnh vuông a: ");
    let S=0;
    if(isNaN(a)){
        document.write("so khong hop le");
    }else if(a<=0){
        document.write("yeu cau nhap so Duong");
    }else {
        S = a * a;
        document.write("Dien tich = "+S);
    }

</script>
</body>
</html>

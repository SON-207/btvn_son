<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Giai phuong trinh bac 2</title>
</head>
<body>
<h1>Giải Phương trình bậc 2</h1>
<input type="number" id="A" placeholder="nhap a">
<input type="number" id="B" placeholder="nhap b">
<input type="number" id="C" placeholder="nhap c">
<button onclick="PTB2()">Giai</button>
<p id="result"></p>
<script>
    function PTB2() {
        let anA = document.getElementById("A").value;
        let anB = document.getElementById("B").value;
        let anC = document.getElementById("C").value;
        let a = Number(anA);
        let b = Number(anB);
        let c = Number(anC);
        if (isNaN(anA) || isNaN(anB) || isNaN(anC)) {
            document.getElementById("result").innerHTML = "vui long nhap lai";
            return;
        }
        if(a === 0){
            if(b === 0){
                if(c ===0){
                    document.getElementById("result").innerHTML = "phuong trinh vo so nghiem";
                }else{
                    document.getElementById("result").innerHTML = "phuong trinh vo nghiem";
                }
            }else{
                let x = -c/ b;
                document.getElementById("result").innerHTML = "phuong trinh co nghiem x = "+x;
            }
            return;
        }


        let delta = Math.pow(b, 2) - 4 * a * c;
        if (delta < 0) {
            document.getElementById("result").innerHTML = "Phuong trinh vo nghiem";
        } else if (delta === 0) {
            let x3 = -b / (2 * a);
            document.getElementById("result").innerHTML = "Phuong trinh co nghiem kep x = " + x3;
        } else {
            x1 = (-b + Math.sqrt(delta)) / (2 * a);
            x2 = (-b - Math.sqrt(delta)) / (2 * a);
            document.getElementById("result").innerHTML = "Phuong trinh co 2 nghiem phan biet <br>" + "x1 = " + x1 + "<br>x2 = " + x2;
        }
    }
</script>
</body>
</html>

Viết chương trình đếm số nguyên âm trong một chuỗi
<body>
<script>
    var N = ["-1","-2","-3"];
    let count = 0;
    for(let i = 0; i < N.length ; i++){
        if(N[i] < 0){
            count++;
        }
    }
    console.log("co " +count +" so nguyen am");
</script>

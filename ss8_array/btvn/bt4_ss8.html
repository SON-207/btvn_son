Bài 1- Viết chương trình khởi tạo/nhập vào một mảng số nguyên và đảo ngược các phần tử trong mảng đó.
<body>
<script>
    let N = +prompt("nhap so nguyen");
    var mang = [];
    for(let i = 0; i < N ; i++){
        let value = prompt("vi tri thu:" +(i+1) +" = " );
        mang.push(value);
    }
    console.log(mang);

</script>
</body>

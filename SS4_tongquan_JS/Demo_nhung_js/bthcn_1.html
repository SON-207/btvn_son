<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dien tich HCN</title>
</head>
<body>
<script>
    // nhap chieu dai va rong
    let chieudai = prompt("Nhập chiều dài:");
    let chieurong = prompt("Nhập chiều rộng:");
    //
    chieudai = Number(chieudai);
    chieurong = Number(chieurong);
    // dien tich
    let dientich = chieudai * chieurong;
    // kq
    alert("Diện tích = " + dientich);
    document.write("Chiều dài = " + chieudai + "<br>");
    document.write("Chiều rộng = " + chieurong + "<br>");
    document.write("Diện tích = " + dientich);
</script>
</body>
</html>
</body>
</html>

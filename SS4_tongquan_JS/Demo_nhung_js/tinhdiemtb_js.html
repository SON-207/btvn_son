<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diem Trung Binh</title>
</head>
<body>
<script>
    let Toan = prompt("Nhap diem toan: " );
    let Ly = prompt("Nhap diem toan: " );
    let Hoa = prompt("Nhap diem toan: " );
    //Chuyen sang so
    Toan = Number(Toan);
    Ly = Number(Ly);
    Hoa = Number(Hoa);
    //tinh
    let TB = (Toan + Ly + Hoa) / 3;
    //kq
    alert("Diem Trung Binh 3 mon = " +TB);
    document.write("Diem Trung Binh 3 mon = " +TB );
</script>

</body>
</html>
